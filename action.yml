name: "GML Code Scanner"
description: "Static analysis and security scanning for GameMaker (GML) projects, with SARIF output for GitHub code scanning."
author: "Mackery"

inputs:
  path:
    description: "Directory to scan: a GameMaker project folder (containing a .yyp) or a repository with one or more projects."
    default: "."
  config:
    description: "Path to a config file. Defaults to .gmlscan.json in the scanned directory, if present."
    default: ""
  suite:
    description: "Rule suite: default, security-extended, security-and-quality or all. Overrides the config file."
    default: ""
  threat-models:
    description: "Untrusted data to track, comma-separated: remote (network/HTTP) and/or local (files, user input). Overrides the config file."
    default: ""
  runtime:
    description: "Target GameMaker runtime version (e.g. 2023.1.1.81). Defaults to the IDEVersion in the .yyp."
    default: ""
  runtime-dir:
    description: "An installed GameMaker runtime folder, such as the runtime-dir output of bscotch/igor-setup. Projects on its release line are checked against its exact function list. Leave empty to use the bundled data."
    default: ""
  upload:
    description: "Upload results to GitHub code scanning (Security tab): auto (upload, warn if unavailable), true (fail if the upload fails) or false."
    default: "auto"
  token:
    description: "Token for the code scanning upload. Needs the security-events: write permission."
    default: ${{ github.token }}
  wait-for-processing:
    description: "Wait until GitHub has processed the upload, to report processing errors and leave out findings whose alerts are dismissed in code scanning."
    default: "true"
  sarif-file:
    description: "Where to write the SARIF report, relative to the workspace."
    default: "gml-code-scanner.sarif"
  category:
    description: "SARIF category, to tell apart several analyses of the same commit (e.g. one per game in a monorepo)."
    default: "gml-code-scanner"
  fail-on:
    description: "Fail the step when findings at this level or above exist: error, warning, note or none."
    default: "error"
  pr-scope:
    description: "On pull requests, which findings to annotate and fail on: changed-lines (only lines the PR adds or edits), changed-files, or all. The SARIF always contains every finding. Needs pull-requests: read."
    default: "changed-lines"
  annotations:
    description: "Show findings as inline annotations on pull requests (works without GitHub code scanning)."
    default: "true"
  max-annotations:
    description: "Maximum number of annotations (GitHub shows at most 10 errors and 10 warnings per step inline)."
    default: "50"
  step-summary:
    description: "Write a findings summary to the job summary."
    default: "true"
  check-updates:
    description: "Look for newer versions of the project's extensions and libraries that support its GameMaker version, and report them as gml/outdated-dependency notes. Defaults to dependencies.checkUpdates in the config file, else true."
    default: ""
  runtime-updates:
    description: "Also report newer GameMaker runtimes, and dependency updates that need one. Defaults to dependencies.runtimeUpdates in the config file, else false."
    default: ""
  auto-update:
    description: "Open pull requests that update extensions, like Dependabot, on runs on the default branch (push, schedule or manual). Needs contents: write and pull-requests: write. Defaults to dependencies.autoUpdate in the config file, else true."
    default: ""

outputs:
  sarif-file:
    description: "Path of the SARIF report."
  sarif-id:
    description: "Code scanning upload id, when results were uploaded."
  findings:
    description: "Number of reported findings (on pull requests, only those within pr-scope). Findings whose alerts are dismissed in code scanning aren't counted."
  total-findings:
    description: "Number of findings in the whole project."
  dismissed:
    description: "Number of findings left out because their alerts are dismissed in code scanning."
  errors:
    description: "Number of reported error-level findings."
  warnings:
    description: "Number of reported warning-level findings."
  notes:
    description: "Number of reported note-level findings."
  outdated-dependencies:
    description: "Number of extensions and libraries with a compatible update."
  update-pull-requests:
    description: "URLs of the update pull requests opened by this run, space-separated."

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "shield"
  color: "green"
