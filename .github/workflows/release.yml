name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1 for a pre-release) to publish a release.
#
# If package.json wasn't bumped to the tag's version first, this workflow bumps it in a commit
# on top of the tagged commit, moves the tag there, and brings the default branch up to date
# afterwards (directly if it can, otherwise through a pull request).
#
# dist/ is not committed on branches. This workflow builds it, commits it on top of the
# tagged commit, and points the version tag (and the major tag, e.g. v1) at that commit,
# so `uses: Mackery6969/GML-Code-Scanner@v1` always gets a bundled action.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # push the release commit/tags and create the release
  pull-requests: write # open the version-bump pull request when the default branch can't be pushed to

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json to match the tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag-version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG_VERSION" = "$PKG_VERSION" ]; then
            echo "package.json is already at $PKG_VERSION."
            exit 0
          fi
          if [ "$(node scripts/compare-versions.ts "$PKG_VERSION" "$TAG_VERSION")" != "-1" ]; then
            echo "::error::package.json is at $PKG_VERSION, which is not older than tag $GITHUB_REF_NAME. Delete the tag and tag a newer version."
            exit 1
          fi
          echo "from-version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tagged-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          npm version "$TAG_VERSION" --no-git-tag-version   # updates package.json and package-lock.json
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $TAG_VERSION"
          echo "bump-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git tag -f "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$GITHUB_REF_NAME"
          echo "::notice::package.json was at $PKG_VERSION, so it was bumped to $TAG_VERSION and $GITHUB_REF_NAME was moved to $(git rev-parse --short HEAD)."

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check docs/rules.md is up to date
        run: |
          npm run docs
          if ! git diff --quiet -- docs/rules.md; then
            echo "::error::docs/rules.md in $GITHUB_REF_NAME is out of date. Run 'npm run docs', commit, and re-tag."
            exit 1
          fi

      - name: Commit the bundle and point the tags at it
        run: |
          git checkout --detach   # the release commit must not land on any branch
          git add --force dist
          git commit --allow-empty -m "Release $GITHUB_REF_NAME (bundled dist/)"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag -f "$GITHUB_REF_NAME" "$RELEASE_SHA"
          TAGS="refs/tags/$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) ;; # pre-releases don't move the major tag
            *)
              MAJOR="${GITHUB_REF_NAME%%.*}"
              git tag -f "$MAJOR" "$RELEASE_SHA"
              TAGS="$TAGS refs/tags/$MAJOR"
              ;;
          esac
          git push -f origin $TAGS
          echo "Tagged $RELEASE_SHA as: $TAGS"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/cli.js gmlscan.mjs
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Created by hand in the UI: just attach the CLI.
            gh release upload "$GITHUB_REF_NAME" "gmlscan.mjs#gmlscan.mjs (standalone CLI: node gmlscan.mjs <path>)" --clobber
          else
            FLAGS=""
            case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              $FLAGS \
              "gmlscan.mjs#gmlscan.mjs (standalone CLI: node gmlscan.mjs <path>)"
          fi

      # The tag got the version bump above; the default branch needs it too, or the next release
      # starts from the old version again. Branch rules usually stop this token from pushing there,
      # so fall back to a pull request.
      - name: Put the version bump on the default branch
        if: steps.version.outputs.bump-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          FROM_VERSION: ${{ steps.version.outputs.from-version }}
          TAG_VERSION: ${{ steps.version.outputs.tag-version }}
          TAGGED_SHA: ${{ steps.version.outputs.tagged-sha }}
          BUMP_SHA: ${{ steps.version.outputs.bump-sha }}
        run: |
          TITLE="chore(release): bump version to $TAG_VERSION"
          git fetch origin "$BRANCH"
          BRANCH_SHA="$(git rev-parse FETCH_HEAD)"
          BRANCH_VERSION="$(git show "$BRANCH_SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "$(node scripts/compare-versions.ts "$BRANCH_VERSION" "$TAG_VERSION")" != "-1" ]; then
            echo "$BRANCH is already at $BRANCH_VERSION."
            exit 0
          fi
          if [ "$BRANCH_SHA" = "$TAGGED_SHA" ]; then
            if git push origin "$BUMP_SHA:refs/heads/$BRANCH"; then
              echo "Pushed the version bump to $BRANCH."
              exit 0
            fi
            echo "Can't push to $BRANCH directly; opening a pull request instead."
            PR_SHA="$BUMP_SHA"
          else
            # $BRANCH has moved on since the tagged commit, so bump on top of its tip instead.
            git switch --detach "$BRANCH_SHA"
            npm version "$TAG_VERSION" --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "$TITLE"
            PR_SHA="$(git rev-parse HEAD)"
          fi
          PR_BRANCH="release/bump-$GITHUB_REF_NAME"
          git push -f origin "$PR_SHA:refs/heads/$PR_BRANCH"
          {
            echo "Tag \`$GITHUB_REF_NAME\` was pushed while package.json was still at \`$FROM_VERSION\`. The release workflow"
            echo "bumped the version on the tag; this brings \`$BRANCH\` up to date so the next release starts from \`$TAG_VERSION\`."
            echo ""
            echo "Opened by the release workflow, so CI does not run on it. It only changes the version in package.json and package-lock.json."
          } > "$RUNNER_TEMP/pr-body.md"
          URL="$(gh pr create --base "$BRANCH" --head "$PR_BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md")"
          echo "::notice::Opened $URL to bump $BRANCH to $TAG_VERSION."

      - name: Marketplace reminder
        run: |
          {
            echo "## Released $GITHUB_REF_NAME"
            echo ""
            echo "Users of \`@${GITHUB_REF_NAME%%.*}\` get this version automatically."
            echo ""
            echo "To list it on GitHub Marketplace: open the release, click **Edit**, tick"
            echo "**Publish this Action to the GitHub Marketplace**, and save (GitHub has no API for this step)."
          } >> "$GITHUB_STEP_SUMMARY"
