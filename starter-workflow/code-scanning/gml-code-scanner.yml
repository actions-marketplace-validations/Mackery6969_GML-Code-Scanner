# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GML Code Scanner finds bugs, security vulnerabilities and performance
# problems in GameMaker (GML) projects and reports them to code scanning.
# See https://github.com/Mackery6969/GML-Code-Scanner

name: GML Code Scanner

on:
  push:
    branches: [ $default-branch, $protected-branches ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ $default-branch ]
  schedule:
    - cron: $cron-weekly

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for the scanner to upload results to code scanning
      pull-requests: read # to annotate only the lines a pull request changes
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set "path" if your GameMaker project (.yyp) is not at the repository root.
      # Private repositories without GitHub Code Security still get pull request
      # annotations and a job summary; the upload to code scanning is skipped.
      - name: Run GML Code Scanner
        uses: Mackery6969/GML-Code-Scanner@eb807119afd6bc585005f21c3acb2a3d98aa2bbe # v1.0.2
        with:
          fail-on: none
